# Production deployment: build the site and upload dist/ to the production
# VK Cloud Object Storage bucket (Moscow region). Full runbook:
# docs/DEPLOYMENT.md.
#
# The publish target is fixed and validated by scripts/deploy-s3-lib.mjs
# (PRODUCTION_TARGET): the workflow cannot redirect signed S3 requests to
# any other bucket or endpoint. Credentials come only from repository
# secrets VK_S3_ACCESS_KEY_ID / VK_S3_SECRET_ACCESS_KEY.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверить план без загрузки'
        type: boolean
        default: false
  # После первого успешного релиза включите автодеплой из main,
  # раскомментировав две строки ниже (второй ключ `on:` не нужен):
  # push:
  #   branches: [main]

permissions:
  contents: read

# Deploys must not overlap; a queued run publishes after the current one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload dist/ to VK Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S3_ENDPOINT: https://hb.ru-msk.vkcloud-storage.ru
      S3_BUCKET: foreverjourney-web
      DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload dist/ to VK Cloud Object Storage
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.VK_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.VK_S3_SECRET_ACCESS_KEY }}
        run: node scripts/deploy-s3.mjs
