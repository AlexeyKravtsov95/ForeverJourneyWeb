# Production deployment: build the site and upload dist/ to a separate
# VK Cloud Object Storage bucket (Moscow region). Full runbook:
# docs/DEPLOYMENT.md.
#
# The first deploy is triggered manually (workflow_dispatch). After the first
# published version has been verified, enable automatic deploys from main by
# uncommenting the push block below and merging that change.
# on:
#   push:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      bucket:
        description: 'Имя бакета VK Cloud Object Storage'
        required: false
        default: 'foreverjourney-web'
        type: string
      endpoint:
        description: 'S3 endpoint (регион Москва)'
        required: false
        default: 'https://hb.ru-msk.vkcloud-storage.ru'
        type: string
      dry_run:
        description: 'Только показать план загрузки, ничего не загружать'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Deploys must not overlap; a queued run publishes after the current one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload dist/ to VK Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S3_ENDPOINT: ${{ inputs.endpoint || 'https://hb.ru-msk.vkcloud-storage.ru' }}
      S3_BUCKET: ${{ inputs.bucket || 'foreverjourney-web' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload dist/ to VK Cloud Object Storage
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.VK_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.VK_S3_SECRET_ACCESS_KEY }}
        run: node scripts/deploy-s3.mjs
